<style>
  :root{
    --bg:#0C0E12; --pane:#141926; --pane-2:#0F131D; --line:#242C3D; --line-soft:#1B2231;
    --text:#EDE7DA; --mut:#8B92A3; --dim:#5C6375;
    --gold:#B79C76; --gold-bright:#D4B98E;
    --peri:#A4C1F9; --sage:#8FBF9F; --brick:#CE8570; --paper:#EDE7DA;
    --disp:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --text-family:"Hanken Grotesk",system-ui,sans-serif;
    --mono:"Spline Sans Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--disp);overflow:hidden}

  .app{display:flex;height:100vh;height:100dvh;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 22px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  header .brand{display:inline-flex;align-items:center;gap:12px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--text);text-decoration:none}
  header .brand img.mk{width:26px;height:auto;display:block}
  header .brand .kicker{display:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-left:2px}
  @media(min-width:960px){header .brand .kicker{display:inline}}
  .tabs{display:flex;gap:6px;align-items:center;margin-left:auto;margin-right:auto}
  @media(min-width:960px){.tabs{margin-left:24px;margin-right:0}}
  .tabs a{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--mut);text-decoration:none;padding:9px 16px;border-radius:999px;
    border:1px solid transparent;transition:color .15s ease,border-color .15s ease,background .15s ease;
    white-space:nowrap;
  }
  .tabs a:hover{color:var(--text);border-color:var(--line)}
  .tabs a[aria-current="page"]{color:var(--gold);border-color:var(--line);background:var(--pane-2)}
  .tabs a.cta{
    color:var(--bg);background:var(--gold);border-color:var(--gold);
    font-weight:700;letter-spacing:.14em;
  }
  .tabs a.cta:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:var(--bg)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  @media(max-width:960px){.legend{display:none}}
  @media(max-width:640px){
    header{padding:10px 14px;gap:8px}
    .tabs a{padding:6px 10px;font-size:10px;letter-spacing:.12em}
    header .brand{font-size:14px}
  }

  .main{display:flex;flex:1;min-height:0}
  .stage{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.hot{cursor:pointer}
  canvas.grab{cursor:grabbing}
  .hint{position:absolute;left:22px;bottom:16px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim);pointer-events:none}

  /* ---- reading pane (the "note") ---- */
  .pane{width:400px;max-width:44vw;border-left:1px solid var(--line-soft);background:var(--pane);
    display:flex;flex-direction:column;min-height:0}
  .pane .crumb{padding:14px 26px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
  .pane .crumb i{width:8px;height:8px;border-radius:50%}
  .pane .scroll{overflow-y:auto;padding:10px 26px 30px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .pane h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:8px 0 4px;text-wrap:balance}
  .pane .sub{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--gold);margin-bottom:14px}
  .pane p{font-size:14px;line-height:1.65;color:#C9CBD3;margin:0 0 13px;max-width:62ch}
  .pane p b,.pane p strong{color:var(--text);font-weight:600}
  .pane .kv{border-top:1px solid var(--line-soft);padding:11px 0}
  .pane .kv:last-child{border-bottom:1px solid var(--line-soft)}
  .pane .kv .k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .pane .kv p{margin:5px 0 0;font-size:13.5px}
  .pane .models{display:flex;flex-direction:column;gap:2px;margin:6px 0 16px}
  .pane .models button{all:unset;cursor:pointer;display:grid;grid-template-columns:10px 1fr;gap:12px;align-items:baseline;
    padding:11px 12px;border:1px solid var(--line-soft);background:var(--pane-2);border-radius:6px;margin-bottom:6px}
  .pane .models button:hover,.pane .models button:focus-visible{border-color:var(--gold);outline:none}
  .pane .models i{width:8px;height:8px;border-radius:50%;background:var(--gold);position:relative;top:-1px}

  .pane .models .d{grid-column:2;font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:2px}
  .pane .foot{margin-top:auto;padding:12px 26px;border-top:1px solid var(--line-soft);
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

  @media(max-width:820px){
    .main{flex-direction:column}
    .pane{width:100%;max-width:none;border-left:none;border-top:1px solid var(--line);height:46%}
    .stage{height:54%}
    .hint{display:none}
  }
  @media (prefers-reduced-motion: reduce){ .pane .models button{transition:none} }

<script>
(function(){
"use strict";
const C = { peri:"#A4C1F9", sage:"#8FBF9F", gold:"#B79C76", brick:"#CE8570", paper:"#EDE7DA" };
const CLUSTER = {
  root:{c:C.paper,name:"The root"},
  insight:{c:C.peri,name:"The insight"},
  engine:{c:C.sage,name:"The engine"},
  fork:{c:C.gold,name:"The fork — undecided"},
  risk:{c:C.brick,name:"Hard constraints"}
};

/* ---------- content ---------- */
const N = [
{id:"eq",label:"EQUALAW",cl:"root",r:15,ax:.46,ay:.30,t:"Equalaw",s:"equal law · access to justice · India",
 d:`<p>What I understand you are building: a claim that <b>the law that applies to you is not a mystery — it is an address.</b> If that claim holds, finding your law becomes a lookup, not a consultation, and everything downstream (matching, economics, trust) follows from it.</p>
    <p>This map is the whole idea in one picture. <b style="color:${C.peri}">Periwinkle</b> is the legal insight that makes it possible. <b style="color:${C.sage}">Sage</b> is the business engine that makes it sustainable. <b style="color:${C.gold}">Gold</b> is the one decision you have not made yet — what kind of company this actually is. <b style="color:${C.brick}">Brick</b> is what reality imposes regardless of your choice.</p>
    <p>Every spec question I asked earlier lives downstream of the gold fork. That is why you stopped me.</p>`},

/* insight */
{id:"thesis",label:"LAW = ROLE × SPACE × TIME",cl:"insight",r:12,ax:.20,ay:.16,t:"Law = Role × Space × Time",s:"the thesis · the intellectual property",
 d:`<p>Any applicable law is a function of three variables: <b>who you are</b> (Role), <b>where you are</b> (Space), <b>when it happened</b> (Time). If that is true, applicable law is <b>computable</b>.</p>
    <p>This is the actual invention. Not the app, not the marketplace — the claim that India's statutory maze collapses into a three-axis lookup. The prototypes proved it holds for ten real routes, including the hardest kind: a hard legal switchover in time.</p>`},
{id:"role",label:"ROLE",cl:"insight",r:8,ax:.07,ay:.08,t:"Role — who you are",s:"axis one",
 d:`<p>Borrower, spouse, tenant, employee, consumer, victim. Your legal identity in the matter opens a specific shelf of statutes: a bounced cheque makes you a <b>borrower</b> under NIA s.138; an unpaid salary makes you an <b>employee</b> under the Payment of Wages Act 1936.</p>`},
{id:"space",label:"SPACE",cl:"insight",r:8,ax:.16,ay:.04,t:"Space — where you are",s:"axis two",
 d:`<p>India's law is layered — central acts everywhere, state acts on top. A tenant in Mumbai lives under the <b>Maharashtra Rent Control Act 1999</b>; the same tenant in Delhi does not. Space is why coverage is the expensive part: every state multiplies the corpus work.</p>`},
{id:"time",label:"TIME",cl:"insight",r:8,ax:.27,ay:.04,t:"Time — when it happened",s:"axis three · the BNS gate",
 d:`<p>Law changes on hard dates. On <b>1 July 2024</b> the Indian Penal Code gave way to the Bharatiya Nyaya Sanhita: theft before that date is IPC s.378, after it is BNS s.303.</p>
    <p>This is a <b>fact, not a probability</b> — which is why time must be a hard gate in any architecture, never a similarity score. The prototypes already treat it that way.</p>`},
{id:"resolver",label:"THE RESOLVER",cl:"insight",r:11,ax:.24,ay:.32,t:"The Resolver",s:"situation in · exact law out",
 d:`<p>The product's heart. Role × Space × Time selects the statute; one free-text sentence disambiguates within it (divorce → HMA s.13 vs. domestic violence → DV Act 2005). Out comes the <b>exact primary source</b>: act, section, citation, link.</p>
    <p>The lite prototype resolves <b>10/10 verified routes deterministically</b>. Whatever model you choose at the fork, this is the shared organ.</p>`},
{id:"gap",label:"THE HONEST GAP",cl:"insight",r:9,ax:.10,ay:.40,t:"The Honest Gap",s:"the trust asset",
 d:`<p>When no rule matches, the resolver says <b>"not covered"</b> — it never invents law. Every rival built on a raw language model hallucinates statutes eventually; a system that refuses to is the moat.</p>
    <p>You flagged this as a discipline, not a feature. I read it as <b>non-negotiable in all four models</b> on this map.</p>`},
{id:"corpus",label:"PRIMARY SOURCES",cl:"insight",r:9,ax:.13,ay:.24,t:"Primary Sources",s:"the raw material",
 d:`<p>Bare acts from India Code, state gazettes, eventually Supreme Court case law. Today: 11 statutes, 4 verbatim, 7 pending.</p>
    <p>Whoever owns <b>clean, structured, current statute data</b> owns the hardest part of this space — the corpus is slow, mechanical, and defensible precisely because nobody wants to do it.</p>`},

/* engine */
{id:"demand",label:"DEMAND · MATTERS",cl:"engine",r:10,ax:.68,ay:.08,t:"Demand — people with matters",s:"one side of the funnel",
 d:`<p>A person with a legal problem doesn't know what law applies, what it should cost, or who to trust. The resolver is the magnet: <b>answer their first question free and correctly</b>, and demand arrives without ad spend.</p>
    <p>In the prototypes, a resolved matter — not a click — is the unit of value.</p>`},
{id:"supply",label:"SUPPLY · ADVOCATES",cl:"engine",r:10,ax:.90,ay:.12,t:"Supply — advocates",s:"the other side",
 d:`<p>Advocates' scarcest resource is client acquisition — and the Bar Council <b>forbids them from advertising</b>. A platform that routes qualified, pre-resolved matters to the right advocate sells the one thing they cannot legally buy for themselves.</p>`},
{id:"match",label:"THE MATCH",cl:"engine",r:11,ax:.78,ay:.26,t:"The Match",s:"the real output",
 d:`<p>Resolved matter meets right advocate — right practice area, right jurisdiction, right court. Everything upstream exists to make this one connection correct.</p>
    <p>Match quality is what compounds: it drives referrals, which drive the flywheel, which drives the economics.</p>`},
{id:"cpl",label:"CPL ECONOMICS",cl:"engine",r:9,ax:.92,ay:.36,t:"CPL — the unit economics",s:"cost per lead · both sides",
 d:`<p>CPL = spend ÷ leads on the demand side; CPA = spend ÷ advocates on supply; blended across both. The prototypes model a blended <b>₹79 falling toward ₹44</b> as the loop compounds (illustrative numbers, honestly flagged as such).</p>
    <p>A defensible CPL is the business thesis in one number.</p>`},
{id:"flywheel",label:"REFERRAL FLYWHEEL",cl:"engine",r:9,ax:.80,ay:.44,t:"The Referral Flywheel",s:"the recursion",
 d:`<p>Better resolution → better matches → satisfied people → referrals → organic demand → lower CPL → more margin to deepen the corpus → better resolution. </p>
    <p>The loop only spins if the resolver is genuinely right. <b>Quality is the fuel, not marketing.</b> That is what makes the CPL defensible rather than rented.</p>`},

/* fork */
{id:"fork",label:"WHAT IS EQUALAW?",cl:"fork",r:14,ax:.46,ay:.60,t:"The Fork",s:"the decision under every other decision",
 d:`<p>Four coherent answers, all built on the same resolver — but they <b>monetize differently, carry different legal risk, and demand different first builds.</b> Pick one as the identity; the others can become layers later. Click each:</p>
    <div class="models">
      <button data-go="mA"><i></i><span class="t">A · The Public Utility</span><span class="d">The Wikipedia of applicable law. Free resolver for everyone; trust first, money later.</span></button>
      <button data-go="mB"><i></i><span class="t">B · The Marketplace</span><span class="d">Resolver in front, advocate matching behind, CPL underneath. The funnel thesis, literally.</span></button>
      <button data-go="mC"><i></i><span class="t">C · The Infrastructure</span><span class="d">Law-as-data. The resolver as an API sold to builders, insurers, banks, HR platforms.</span></button>
      <button data-go="mD"><i></i><span class="t">D · The Companion</span><span class="d">A guided legal journey — "what do I do now," documents, timelines, human handoff.</span></button>
    </div>
    <p>My read: the prototypes lean B, your discipline (honest gap, primary sources) leans A/C, and D is where the deepest value and the deepest liability both live.</p>`},
{id:"mA",label:"A · PUBLIC UTILITY",cl:"fork",r:10,ax:.16,ay:.76,t:"Model A — The Public Utility",s:"the Wikipedia of applicable law",
 d:`<p>The resolver, free, for everyone. A civic trust engine: type your situation, get the exact law with the primary source. No accounts, no funnel — reach and authority first.</p>
    <div class="kv"><span class="k">Who pays</span><p>Nobody at first. Later: grants, CSR, court/legal-aid partnerships — or the models above it, built on its trust.</p></div>
    <div class="kv"><span class="k">First build</span><p>Corpus + resolver. Nothing else.</p></div>
    <div class="kv"><span class="k">The risk</span><p>Beloved but unfunded — a public good without a business until a layer is added.</p></div>
    <div class="kv"><span class="k">Already proven</span><p>The lite prototype <b>is</b> this, working, in one file.</p></div>`},
{id:"mB",label:"B · MARKETPLACE",cl:"fork",r:10,ax:.38,ay:.86,t:"Model B — The Marketplace",s:"lead-gen for legal services",
 d:`<p>Two-sided: people with matters on one side, advocates on the other, the resolver qualifying every lead before it costs anyone anything. This is the CPL thesis as literal product.</p>
    <div class="kv"><span class="k">Who pays</span><p>Advocates — per introduction or subscription. Never a cut of fees (see the BCI node).</p></div>
    <div class="kv"><span class="k">First build</span><p>Matter intake + a curated advocate bench + matching. The resolver already exists.</p></div>
    <div class="kv"><span class="k">The risk</span><p>Bar Council rules force careful structuring: a directory/introduction service is defensible, a fee-sharing broker is not.</p></div>
    <div class="kv"><span class="k">Already proven</span><p>Fork A's two-sided CPL engine and the v2 loop simulator.</p></div>`},
{id:"mC",label:"C · INFRASTRUCTURE",cl:"fork",r:10,ax:.60,ay:.88,t:"Model C — The Infrastructure",s:"law as data · resolver as API",
 d:`<p>Sell the resolver to builders: insurers checking claims, banks doing recovery notices, HR platforms, other legal-tech. "Which law applies" as an API call with a citation attached.</p>
    <div class="kv"><span class="k">Who pays</span><p>Businesses — per call or license. B2B money, no consumer acquisition cost at all.</p></div>
    <div class="kv"><span class="k">First build</span><p>Structured statute database + versioned API + documentation. The determinism you already insisted on makes it API-shaped by nature.</p></div>
    <div class="kv"><span class="k">The risk</span><p>Slow enterprise sales, and the moat is corpus depth — exactly the part that is 7/11 unfilled.</p></div>
    <div class="kv"><span class="k">Already proven</span><p>The resolver's pure-function design and the time-gate discipline.</p></div>`},
{id:"mD",label:"D · COMPANION",cl:"fork",r:10,ax:.80,ay:.80,t:"Model D — The Companion",s:"the guided legal journey",
 d:`<p>Not just "which law" but <b>"what do I do now"</b> — notices, documents, timelines, next steps, an AI paralegal that hands off to a human advocate at the right moment.</p>
    <div class="kv"><span class="k">Who pays</span><p>Consumers (freemium) and advocates (for qualified, prepared handoffs).</p></div>
    <div class="kv"><span class="k">First build</span><p>Everything: resolver + workflow + document generation + a licensed-review path. The heaviest lift on this map.</p></div>
    <div class="kv"><span class="k">The risk</span><p>Walks closest to practising law. "Not legal advice" in the footer will not carry it — it needs structural liability design.</p></div>
    <div class="kv"><span class="k">Already proven</span><p>Only the first step: resolution. The journey after it is unbuilt.</p></div>`},

/* risk */
{id:"bci",label:"BCI RULES",cl:"risk",r:9,ax:.62,ay:.68,t:"Bar Council of India rules",s:"the regulatory wall",
 d:`<p>Advocates may not advertise (BCI Rules, Rule 36) and may not share fees with non-advocates. Any model that monetizes advocate demand must be an <b>introduction/directory service, never a broker taking a cut of fees.</b></p>
    <p>This single constraint shapes Models B and D more than any technical choice on the map — and it is also the opportunity: a lawful channel to clients is precisely what advocates cannot build for themselves.</p>`},
{id:"liab",label:"NOT LEGAL ADVICE",cl:"risk",r:9,ax:.90,ay:.62,t:'"Not legal advice"',s:"a disclaimer is not a shield",
 d:`<p>The honest-gap discipline plus verbatim primary-source citation keeps Models A and C in <b>legal-information</b> territory — showing someone the law is not practising it.</p>
    <p>Model D crosses toward advice. It needs a licensed-review path and structural separation (the advocate advises; the product prepares), not just a footer.</p>`}
];

const L = [
["eq","thesis"],["eq","fork"],["eq","match"],
["thesis","role"],["thesis","space"],["thesis","time"],["thesis","resolver"],
["resolver","gap"],["resolver","corpus"],["resolver","match"],["resolver","demand"],
["demand","match"],["supply","match"],["match","cpl"],["cpl","flywheel"],["flywheel","demand"],
["fork","mA"],["fork","mB"],["fork","mC"],["fork","mD"],
["mA","gap"],["mB","cpl"],["mB","bci"],["mC","corpus"],["mD","liab"],["mD","bci"],["supply","bci"],["mD","demand"]
];

/* ---------- graph ---------- */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const panel=document.getElementById("panel"),crumb=document.getElementById("crumb");
let W=0,H=0,dpr=1;
const byId={}; N.forEach(n=>{byId[n.id]=n; n.x=0;n.y=0;n.vx=0;n.vy=0;});
const links=L.map(([a,b])=>({a:byId[a],b:byId[b]}));
const adj={}; N.forEach(n=>adj[n.id]=new Set([n.id]));
links.forEach(l=>{adj[l.a.id].add(l.b.id);adj[l.b.id].add(l.a.id);});

function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
function seed(){
  const m=70;
  N.forEach(n=>{ n.x=m+n.ax*(W-2*m); n.y=m+n.ay*(H-2*m); n.vx=n.vy=0; });
}
function tick(){
  const m=46;
  for(const l of links){
    const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.hypot(dx,dy)||1;
    const rest=Math.min(W,H)*0.16+l.a.r+l.b.r;
    const f=(d-rest)*0.004, fx=dx/d*f, fy=dy/d*f;
    l.a.vx+=fx;l.a.vy+=fy;l.b.vx-=fx;l.b.vy-=fy;
  }
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
    const a=N[i],b=N[j];
    let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
    if(d2<1){dx=(Math.random()-.5);dy=(Math.random()-.5);d2=1;}
    if(d2<52000){const d=Math.sqrt(d2),f=520/d2,fx=dx/d*f,fy=dy/d*f;
      a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;}
  }
  for(const n of N){
    const tx=m+n.ax*(W-2*m),ty=m+n.ay*(H-2*m);
    n.vx+=(tx-n.x)*0.012; n.vy+=(ty-n.y)*0.012;
    if(n===drag)continue;
    n.vx*=0.86;n.vy*=0.86;n.x+=n.vx;n.y+=n.vy;
    n.x=Math.max(m,Math.min(W-m,n.x)); n.y=Math.max(m,Math.min(H-m,n.y));
  }
}
let hover=null,sel=null,drag=null;
function draw(){
  ctx.clearRect(0,0,W,H);
  const focus=hover||sel;
  for(const l of links){
    const on=!focus||(adj[focus.id].has(l.a.id)&&adj[focus.id].has(l.b.id)&&(l.a===focus||l.b===focus));
    ctx.strokeStyle=on&&focus? "rgba(212,185,142,.55)":"rgba(122,132,156,"+(focus?".07":".22")+")";
    ctx.lineWidth=on&&focus?1.4:1;
    ctx.beginPath();ctx.moveTo(l.a.x,l.a.y);ctx.lineTo(l.b.x,l.b.y);ctx.stroke();
  }
  for(const n of N){
    const c=CLUSTER[n.cl].c;
    const on=!focus||adj[focus.id].has(n.id);
    ctx.globalAlpha=on?1:0.16;
    ctx.shadowColor=c; ctx.shadowBlur=(n===focus)?26:12;
    ctx.fillStyle=c;
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();
    ctx.shadowBlur=0;
    if(n===sel){ctx.strokeStyle="#D4B98E";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r+4.5,0,7);ctx.stroke();}
    ctx.font="600 10px ui-monospace,Menlo,Consolas,monospace";
    ctx.textAlign="center";
    ctx.fillStyle=on?"rgba(237,231,218,.92)":"rgba(237,231,218,.3)";
    const lw=ctx.measureText(n.label).width;
    ctx.fillStyle="rgba(12,14,18,.72)";
    ctx.fillRect(n.x-lw/2-4,n.y+n.r+7,lw+8,14);
    ctx.fillStyle=on?"rgba(237,231,218,.94)":"rgba(237,231,218,.34)";
    ctx.fillText(n.label,n.x,n.y+n.r+17.5);
    ctx.globalAlpha=1;
  }
}
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(){tick();draw();requestAnimationFrame(loop);}

/* ---------- panel ---------- */
function show(n){
  sel=n;
  const cl=CLUSTER[n.cl];
  crumb.innerHTML=`<i style="background:${cl.c}"></i><span>${cl.name}</span>`;
  panel.innerHTML=`<h1>${n.t}</h1><div class="sub">${n.s}</div>${n.d}`;
  wire();
  panel.parentElement.querySelector(".scroll").scrollTop=0;
}
function home(){
  sel=null;
  crumb.innerHTML=`<i style="background:${C.paper}"></i><span>Start here</span>`;
  panel.innerHTML=byId.eq.d.replace("<p>What I understand",
    `<h1>What is actually being built</h1><div class="sub">read me first · then click the gold nodes</div><p>What I understand`);
  wire();
}
function wire(){
  panel.querySelectorAll("[data-go]").forEach(b=>{
    b.addEventListener("click",()=>{const n=byId[b.dataset.go]; if(n){show(n);}});
  });
}

/* ---------- interaction ---------- */
function pick(x,y){
  for(let i=N.length-1;i>=0;i--){const n=N[i];
    if(Math.hypot(x-n.x,y-n.y)<n.r+9)return n;}
  return null;
}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
let moved=false;
cv.addEventListener("pointerdown",e=>{
  const[x,y]=pos(e);const n=pick(x,y);moved=false;
  if(n){drag=n;cv.setPointerCapture(e.pointerId);cv.classList.add("grab");}
});
cv.addEventListener("pointermove",e=>{
  const[x,y]=pos(e);
  if(drag){drag.x=x;drag.y=y;drag.vx=drag.vy=0;moved=true;return;}
  hover=pick(x,y);
  cv.classList.toggle("hot",!!hover);
});
cv.addEventListener("pointerup",e=>{
  cv.classList.remove("grab");
  if(drag&&!moved)show(drag);
  else if(!drag){const[x,y]=pos(e);const n=pick(x,y);if(n)show(n);}
  drag=null;
});
cv.addEventListener("pointerleave",()=>{hover=null;cv.classList.remove("hot");});

window.addEventListener("resize",()=>{resize();});
resize();seed();
if(reduced){for(let i=0;i<420;i++)tick();}
else{for(let i=0;i<160;i++)tick();}
home();
loop();
})();
</script>
