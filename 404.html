<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Equalaw</title>
    <link rel="icon" href="/assets/equalaw-logo-v2.svg?v=20260622" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#1C2A3F">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/ui-components.css?v=20260622">
    <script src="/assets/analytics.js"></script>
    <!-- i18n: Language detection & translation system -->
    <script src="/assets/i18n.js"></script>
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Hanken Grotesk', system-ui, sans-serif;
            background: #F3F1EA;
            color: #16140f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .emblem { margin-bottom: 1.5rem; opacity: 0.15; }
        h1 { font-size: 6rem; font-weight: 800; color: var(--color-primary); line-height: 1; }
        h2 { font-size: 1.5rem; font-weight: 700; margin: 0.75rem 0 0.5rem; }
        p  { font-size: 1rem; color: #64748b; max-width: 360px; line-height: 1.6; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            margin-top: 2rem;
            background: var(--color-primary); color: white;
            font-size: 0.95rem; font-weight: 700;
            padding: 0.85rem 2rem; border-radius: 9999px;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        .btn:hover { background: var(--color-primary-dark); transform: translateY(-2px); }
        footer { margin-top: 3rem; font-size: 0.7rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="emblem">
        <img src="/assets/equalaw-icon-navy.svg" alt="" width="72" height="72">
    </div>

    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist. Let's get you back to where you can find the legal guidance you need.</p>

    <a href="/" class="btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Back to Equalaw
    </a>

    <footer>Equalaw is a technology platform, not a law firm.</footer>

    <!-- Floating Language Picker -->
    <div id="lang-picker">
        <button id="lang-toggle" aria-label="Change language">🌐</button>
        <div id="lang-dropdown" class="hidden"></div>
    </div>

    <script>
        document.addEventListener('i18n-ready', function() {
            const dropdown = document.getElementById('lang-dropdown');
            const langs = getSupportedLanguages();
            dropdown.innerHTML = langs.map(lang => `
                <button onclick="switchLanguage('${lang.code}')" ${lang.code === getCurrentLang() ? 'selected' : ''}>
                    ${lang.name} ${lang.code === getCurrentLang() ? '✓' : ''}
                </button>
            `).join('');

            document.getElementById('lang-toggle').addEventListener('click', function(e) {
                e.stopPropagation();
                dropdown.classList.toggle('open');
            });
            document.addEventListener('click', () => dropdown.classList.remove('open'));
        });
    </script>
</body>
</html>
